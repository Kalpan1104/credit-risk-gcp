name: Deploy functions

# Redeploy the Cloud Run functions when their code changes on main.
# Models are NOT deployed here: the functions read the champion from Cloud Storage.
on:
  push:
    branches: [main]
    paths: ["src/**", "function/**", "infra/deploy.sh", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write          # lets the job get a GitHub OIDC token for Workload Identity Federation

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    if: vars.WIF_PROVIDER != ''     # skipped until Google Cloud is set up (Step 5 in the README)
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
      REGION: ${{ vars.GCP_REGION }}
      BUCKET: ${{ vars.GCS_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy score + monitor
        run: bash infra/deploy.sh
      - name: Check both functions are ACTIVE
        run: |
          for fn in score monitor; do
            state=$(gcloud functions describe "$fn" --region="$REGION" --format='value(state)')
            url=$(gcloud functions describe "$fn" --region="$REGION" --format='value(serviceConfig.uri)')
            echo "$fn: $state $url"
            echo "- **$fn** $state: $url" >> "$GITHUB_STEP_SUMMARY"
            [ "$state" = "ACTIVE" ] || exit 1
          done
